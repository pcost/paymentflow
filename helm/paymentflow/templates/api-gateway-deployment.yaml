apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: paymentflow
    component: api-gateway
spec:
  replicas: {{ .Values.api-gateway.replicas }}
  selector:
    matchLabels:
      app: paymentflow
      component: api-gateway
  template:
    metadata:
      labels:
        app: paymentflow
        component: api-gateway
      annotations:
        config.checksum: "{{ .Values.global.configChecksum }}"
    spec:
      containers:
      - name: api-gateway
        image: "{{ .Values.api-gateway.image }}:{{ .Values.global.imageTag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: APP_ENV
          value: "{{ .Values.global.environment }}"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8080"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "{{ .Values.api-gateway.resources.requests.memory }}"
            cpu: "{{ .Values.api-gateway.resources.requests.cpu }}"
          limits:
            memory: "{{ .Values.api-gateway.resources.limits.memory }}"
            cpu: "{{ .Values.api-gateway.resources.limits.cpu }}"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: paymentflow
    component: api-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway
spec:
  to:
    kind: Service
    name: api-gateway
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
