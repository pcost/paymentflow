# Global
global:
  namespace: default
  imageTag: "latest"
  configChecksum: ""
  environment: "dev"

# Services
api-gateway:
  replicas: 1
  image: image-registry.openshift-image-registry.svc:5000/harshitmohan2765-dev/api-gateway
  port: 8080
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

order-service:
  replicas: 1
  image: image-registry.openshift-image-registry.svc:5000/harshitmohan2765-dev/order-service
  port: 8080
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

payment-service:
  replicas: 1
  image: image-registry.openshift-image-registry.svc:5000/harshitmohan2765-dev/payment-service
  port: 8080
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

notification-service:
  replicas: 1
  image: image-registry.openshift-image-registry.svc:5000/harshitmohan2765-dev/notification-service
  port: 8080
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

postgresql:
  enabled: true
  replicas: 1
  image: registry.redhat.io/rhel9/postgresql-15:latest
  port: 5432
  storage: 5Gi
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

# Ingress / Route
route:
  host: ""  # auto-generated
  tls:
    termination: edge

